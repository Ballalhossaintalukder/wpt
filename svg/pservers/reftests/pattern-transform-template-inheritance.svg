<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="400" height="100"><title>SVG Paint Servers: only a specified patternTransform stops template inheritance.</title><metadata><html:link href="https://w3c.github.io/svgwg/svg2-draft/pservers.html#PaintServerTemplates" rel="help"/><html:link href="https://w3c.github.io/svgwg/svg2-draft/pservers.html#PatternElementPatternTransformAttribute" rel="help"/><html:link href="reference/pattern-transform-template-inheritance-ref.svg" rel="match"/><html:meta content="maxDifference=0-2; totalPixels=0-2500" name="fuzzy"/></metadata><defs><pattern id="pattern-base" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="green"/></pattern><pattern id="pattern-empty" href="#pattern-base"/><pattern id="pattern-invalid" href="#pattern-base" patternTransform="bogus"/><pattern id="pattern-absent" href="#pattern-base"/><pattern id="pattern-svgdom" href="#pattern-base"/></defs><rect width="80" height="80" x="10" y="10" fill="url(#pattern-empty)"/><rect width="80" height="80" x="110" y="10" fill="url(#pattern-invalid)"/><rect width="80" height="80" x="210" y="10" fill="url(#pattern-absent)"/><rect width="80" height="80" x="310" y="10" fill="url(#pattern-svgdom)"/><script><![CDATA[
    var transform = document.documentElement.createSVGTransform();
    transform.setTranslate(5, 0);
    document.getElementById("pattern-svgdom").patternTransform.baseVal.appendItem(transform);
  ]]></script></svg>